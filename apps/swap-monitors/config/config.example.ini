[General]
Hotkey=^+MButton
DiagnosticHotkey=^!+d

RequireAdmin=1
RequireExactlyTwoMonitors=1
IncludeUnmanagedWindows=1
IncludeMinimizedWindows=1
IncludeMaximizedWindows=1
IncludeFullscreenWindows=1

GeometryTolerancePx=5
MaxMoveFailurePercent=25

UseWorkArea=1
UseAtomicWindowMove=1
RestoreActiveWindow=1
ShowSuccessNotification=1
ShowErrorNotification=1
EnableLog=1
LogLevel=INFO

[MonitorA]
DeviceName=\\.\DISPLAY1

[MonitorB]
DeviceName=\\.\DISPLAY2

[Exclusions]
Process1=WindowCountdownWidget.exe

Class1=Shell_TrayWnd
Class2=Shell_SecondaryTrayWnd
Class3=Progman
Class4=WorkerW
Class5=Windows.UI.Core.CoreWindow
Class6=tooltips_class32
Class7=#32768

[ExpectedWindows]
; Optional: Process|Class|Title substring
; Rule1=Code.exe|Chrome_WidgetWin_1|

[General]
Hotkey=^+MButton
DiagnosticHotkey=^!+d

RequireAdmin=1
RequireExactlyTwoMonitors=1
IncludeUnmanagedWindows=1
IncludeMinimizedWindows=1
IncludeMaximizedWindows=1
IncludeFullscreenWindows=1

GeometryTolerancePx=5
MaxMoveFailurePercent=25

UseWorkArea=1
UseAtomicWindowMove=1
RestoreActiveWindow=1
ShowSuccessNotification=1
ShowErrorNotification=1
EnableLog=1
LogLevel=INFO

[MonitorA]
DeviceName=\\.\DISPLAY2

[MonitorB]
DeviceName=\\.\DISPLAY1

[Exclusions]
Process1=WindowCountdownWidget.exe

Class1=Shell_TrayWnd
Class2=Shell_SecondaryTrayWnd
Class3=Progman
Class4=WorkerW
Class5=Windows.UI.Core.CoreWindow
Class6=tooltips_class32
Class7=#32768

[ExpectedWindows]
; Optional: Process|Class|Title substring
Rule1=explorer.exe|CabinetWClass|
Rule2=ChatGPT Classic.exe|Chrome_WidgetWin_1|ChatGPT Classic
Rule3=ChatGPT.exe|Chrome_WidgetWin_1|ChatGPT
Rule4=cmd.exe|ConsoleWindowClass|Administrator: Windows Command Center
Rule5=WindowsTerminal.exe|CASCADIA_HOSTING_WINDOW_CLASS|Administrator: PowerShell
Rule6=chrome.exe|Chrome_WidgetWin_1|
Rule7=Telegram.exe|Qt51519QWindowIcon|
Rule8=PotPlayerMini64.exe|PotPlayer64|
